<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><style>
  body { font-family: system-ui; width: 260px; padding: 12px; }
  input { width: 100%; box-sizing: border-box; margin: 6px 0; padding: 6px; }
  button { width: 100%; padding: 6px; background: #4f46e5; color: #fff; border: 0; border-radius: 8px; cursor: pointer; margin-top: 4px; }
  button.run { background: #0ea5e9; }
  .ok { color: #16a34a; } .err { color: #dc2626; }
</style></head>
<body>
  <strong>ProspAI</strong>
  <p style="font-size:12px;color:#64748b">Connecte ton compte pour executer les actions LinkedIn.</p>
  <input id="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Mot de passe" />
  <button id="login">Se connecter</button>
  <button id="run" class="run">Executer les actions maintenant</button>
  <p id="status" style="font-size:11px;color:#64748b"></p>
  <script>
    const API = "http://localhost:8000";
    document.getElementById("login").onclick = async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const res = await fetch(API + "/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      if (res.ok) {
        const data = await res.json();
        chrome.storage.local.set({ prospai_token: data.access_token });
        document.getElementById("status").textContent = "Connecte !";
        document.getElementById("status").className = "ok";
      } else {
        document.getElementById("status").textContent = "Identifiants invalides";
        document.getElementById("status").className = "err";
      }
    };
    document.getElementById("run").onclick = async () => {
      document.getElementById("status").textContent = "Tick lance...";
      chrome.runtime.sendMessage({ type: "RUN_NOW" });
    };
  </script>
</body>
</html>
