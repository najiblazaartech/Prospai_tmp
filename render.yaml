services:
  - type: web
    name: prospai-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: WEB_DISCOVERY
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: prospai-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000
databases:
  - name: prospai-db
    plan: free
    region: frankfurt
    databaseName: prospai
    user: prospai
